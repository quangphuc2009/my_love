<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món quà bất ngờ</title>
    <style>
        /* --- GIỮ NGUYÊN PHẦN CSS --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6; /* Màu nền hồng nhạt */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        /* Style cho Form nhập liệu */
        #login-form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ffcccc;
            border-radius: 5px;
            outline: none;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e60000;
        }

        /* Style cho Hộp quà */
        #gift-box {
            font-size: 100px;
            cursor: pointer;
            display: none;
            position: absolute;
            top: -150px;
            transition: transform 0.2s;
            z-index: 10; /* Đảm bảo hộp quà nằm trên cùng */
        }

        #gift-box:hover {
            transform: scale(1.1);
        }

        /* Hiệu ứng rơi */
        @keyframes fall {
            0% { top: -150px; }
            60% { top: 50%; transform: translateY(-50%); }
            80% { top: 45%; transform: translateY(-50%); }
            100% { top: 50%; transform: translateY(-50%); }
        }

        .falling {
            display: block !important;
            animation: fall 1.5s forwards ease-in-out;
        }

        /* Style cho dòng chữ cuối cùng */
        #message {
            display: none;
            position: absolute; /* Định vị tuyệt đối để căn giữa */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; /* Đảm bảo không bị tràn màn hình */
            font-size: 28px; /* Tăng kích thước chữ lên một chút */
            color: #d63031;
            font-weight: bold;
            animation: fadeIn 2s;
            z-index: 5; /* Nằm dưới hộp quà khi chưa mở */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1); /* Thêm bóng cho chữ nổi bật */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); } /* Hiệu ứng hiện lên nhẹ nhàng */
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div id="login-form">
        <h2 style="color: #ff4d4d;">Chào bạn!</h2>
        <p>Nhập thông tin để nhận quà nhé</p>
        <input type="text" id="name" placeholder="Họ và tên của em">
        <input type="date" id="dob">
        <button onclick="checkInfo()">Nhận quà</button>
    </div>

    <div id="gift-box" onclick="openGift()">🎁</div>

    <div id="message">
        Tôi yêu em, bé iu của tôi 😘
    </div>

    <script>
        function checkInfo() {
            const name = document.getElementById('name').value;
            const dob = document.getElementById('dob').value;

            // Kiểm tra nhập liệu (tùy chọn)
            if (name === "" || dob === "") {
                alert("Em chưa nhập tên hoặc ngày sinh kìa! 😠");
                return;
            }

            // Ẩn form và hiện hộp quà rơi
            document.getElementById('login-form').style.display = 'none';
            const gift = document.getElementById('gift-box');
            gift.classList.add('falling');
        }

        // --- HÀM NÀY ĐÃ ĐƯỢC SỬA ---
        function openGift() {
            // Xóa hẳn phần tử hộp quà khỏi trang web
            const giftElement = document.getElementById('gift-box');
            if (giftElement) {
                giftElement.remove();
            }

            // Hiện lời chúc
            document.getElementById('message').style.display = 'block';
            
            // Kích hoạt hiệu ứng tim bay
            createHearts();
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '100vh';
                heart.style.fontSize = Math.random() * 20 + 20 + 'px';
                heart.style.zIndex = '1'; // Tim bay ở lớp nền
                heart.style.transition = '4s ease-in'; // Bay lên chậm rãi
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.style.top = '-10vh';
                    heart.style.opacity = '0';
                }, 100);

                setTimeout(() => {
                    heart.remove();
                }, 4100);
            }, 300);
        }
    </script>
</body>
</html>
